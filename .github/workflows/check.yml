name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/check.mjs
      # Reads the live app when the secret is set, so a renamed module fails here, not on deploy.
      - run: node scripts/deploy.mjs --dry-run
        env:
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          MAKE_ZONE: ${{ vars.MAKE_ZONE }}
          MAKE_APP_NAME: ${{ vars.MAKE_APP_NAME }}
          MAKE_APP_VERSION: ${{ vars.MAKE_APP_VERSION }}
