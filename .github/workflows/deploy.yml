name: Deploy

on:
  push:
    branches: [main]
    paths:
      - app.json
      - base.json
      - groups.json
      - connection/**
      - modules/**
      - scripts/deploy.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
      MAKE_ZONE: ${{ vars.MAKE_ZONE }}
      MAKE_APP_NAME: ${{ vars.MAKE_APP_NAME }}
      MAKE_APP_VERSION: ${{ vars.MAKE_APP_VERSION }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$MAKE_API_KEY" ] || [ -z "$MAKE_ZONE" ] || [ -z "$MAKE_APP_NAME" ] || [ -z "$MAKE_APP_VERSION" ]; then
            echo "::notice::Skipping deploy: set the MAKE_API_KEY secret and the MAKE_ZONE, MAKE_APP_NAME and MAKE_APP_VERSION variables."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - if: steps.config.outputs.configured == 'true'
        run: node scripts/deploy.mjs
